r Gün Değil Bir Mevsim",author:"Mert Yolcu",time:"9 dk",summary:"Turist olarak gitmek ile misafir olarak kalmak arasındaki fark. Bir coğrafyayı gezmek değil, onun sizi gezmesine izin vermek.",image:"https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?q=80&w=1200&auto=format&fit=crop",color:"bg-[#DDD9CF]",content:["Kapadokya'ya herkes gider, ama çok az kişi kalır. Gidenler balona biner, fotoğraf çeker, şarap tadımı yapar ve döner. Kalanlar ise sabahın beşinde fırının önünde bekler. Çünkü orada hayat, Instagram'ın kadrajından daha yavaş akar. Ben ikinciyi denedim: Üç hafta, Uçhisar'da bir taş evde.","İlk günler coğrafya size gösteri sunar. İkinci hafta ise gösteri biter, gerçek başlar. Rüzgârın peribacasını nasıl yonttuğunu değil, o rüzgârda çamaşırın nasıl kuruduğunu öğrenirsiniz. Kayadan oyma kilisenin freskini değil, o kilisenin yanındaki bağda çalışan Hasan amcanın ellerindeki çatlakları görürsünüz. Gezmek, görmekten çıkıp ilişki kurmaya evrilir.","Kapadokya'da 'ile' olmak, volkanik tüfün size öğrettiği bir şey var: Yumuşak olan aşınır ama şekil alır. Sert olan kırılır. Seyahatlerimizde de sert planlarla gidiyoruz; her saatimiz dolu. Oysa tüf gibi olsak, rüzgâra izin versek, plan biraz aşınsa ama hatıra şekil alsa?","Bir mevsim kalınca anlıyorsunuz: Peribacaları bir dekor değil, bir ev sahibi. Siz onun misafirisiniz. Ve iyi misafir, ev sahibinin ritmine uyar. Sabah erken kalkar, öğlen gölgeye çekilir, akşamüstü sohbet eder. Kapadokya'yı gezmedim, onunla yaşadım. Bu yüzden artık fotoğraflarıma bakmıyorum; ellerime bakıyorum. Hala biraz tüf tozu var."]},{id:"sanat",category:"Sanat",title:"Toprakla Boyamak: Göbeklitepe'den Çağdaş Seramiğe",author:"Deniz Toprak",time:"8 dk",summary:"İlk pigment topraktı. İlk fırça parmaktı. Seramik, insanın toprağa bıraktığı en eski mektup.",image:"https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?q=80&w=1200&auto=format&fit=crop",color:"bg-[#E8E2D6]",content:["Göbeklitepe'de bir sütunun dibinde, avuç içi kadar bir kırmızı leke bulundu. Analiz edildi: Demir oksit. Yani aşı boyası. 12.000 yıl önce biri, toprağı ezmiş, suyla karıştırmış ve taşa sürmüş. Sanat tarihi hep mağara resimleriyle başlar, ama aslında toprakla başlar. Çünkü ilk boya, uzak bir yerden gelmedi; ayağımızın altındaydı.","Anadolu'da her köyün bir toprağı vardır, bir rengi vardır. Kütahya'nın beyazı, Çanakkale'nin kırmızısı, Avanos'un devetüyü rengi. Çağdaş seramik sanatçısı Elif Uras'la atölyesinde konuşurken şöyle dedi: 'Çamuru yoğurmak, coğrafyayı yoğurmaktır.' Gerçekten de bir kâse yaparken sadece form vermiyorsunuz; bir vadinin mineralini, bir nehrin alüvyonunu şekillendiriyorsunuz.","Bugün galerilerde gördüğümüz parlak, pürüzsüz seramikler çok güzel. Ama beni asıl etkileyen, hatayı saklamayanlar. Çatlağını sırla kapamayan, pişerken eğilen, rengi tam tutmayanlar. Çünkü toprak, kontrol edilebilen bir malzeme değil; ikna edilen bir malzeme. Tıpkı bir insan gibi.","Toprakla boyamak, sahiplenmemeyi öğrenmektir. Fırından çıkan her parça biraz sürprizdir. Ve bu sürpriz, sanatın en dürüst hali. Göbeklitepe'deki o kırmızı lekeyi bırakan insan da bunu biliyordu: Ben yaptım, ama toprak bitirdi."]},{id:"felsefe",category:"Felsefe",title:"Yol Neden Bitmez? — Yürümenin Fenomenolojisi",author:"Can Ulusoy",time:"10 dk",summary:"Yürümek, A'dan B'ye gitmek değildir. Yürümek, B'yi unutup A'yı da arkanda bırakmaktır. Yol bitmez çünkü sen değişirsin.",image:"https://images.unsplash.com/photo-1476979735039-2fdea9e40715?q=80&w=1200&auto=format&fit=crop",color:"bg-[#DCE0D5]",content:["Arabayla giderken yol bir çizgidir. Haritada, navigasyonda. Ama yürürken yol bir hacimdir. Ayak bileğinizi yoklayan taş, baldırınızı yakan yokuş, ensenize vuran güneş... Yol, bedenle düşünülür. Heidegger'in 'yolda olmak' dediği şey, romantik bir metafor değil; bilişsel bir durum. Zihin, yürürken farklı çalışır. Bu yüzden filozoflar yürümüş.","Patika ilginç bir kelime. Yol değil, iz. Birileri daha önce geçmiş ve otlar ezilmiş. Yani patika, bir başkasının yürüyüşünün tortusu. Onu takip etmek, yalnız olmadığını bilmektir. Ama patika hiçbir zaman otoban gibi net değildir. Bazen kaybolur, sonra tekrar belirir. Tıpkı düşünce gibi. Kant'ın, Rousseau'nun günde saatlerce yürümesi tesadüf değildi; düşünce, masa başında değil, patika üstünde netleşir.","Yol neden bitmez? Çünkü varılacak yer, haritadaki bir nokta değil. Yürüyen kişi, yürüdükçe değişir. Likya Yolu'nda onuncu gündeki sen, birinci gündeki sen değilsin. Ayakların nasır tutmuş, sabrın artmış, susmaya alışmışsın. O yüzden yolun sonuna vardığında, vardığın yer başlangıçtaki hayalinle aynı değil. Yol biter, ama yürüme bitmez.","Bu yüzden Patika dergisine bu ismi verdik. Biz bir varış vadetmiyoruz. Bir yürüyüş biçimi öneriyoruz: Yavaş, iz bırakan ama izi silmeyen, yolu değil yolculuğu önemseyen. Belki de direniş budur. Her şeyin hızla varmaya çalıştığı bir çağda, bilerek yavaşlamak."]}];function qo(){let[e,t]=Ft.useState(null),[n,r]=Ft.useState(""),[l,i]=Ft.useState(!1),[o,u]=Ft.useState(!1);Ft.useEffect(()=>{if(e)document.body.style.overflow="hidden";else document.body.style.overflow="auto"},[e]);let a=(s)=>{u(!1);let p=document.getElementById(s);if(p)p.scrollIntoView({behavior:"smooth",block:"start"})};return N("div",{className:"bg-[#FDFBF7] text-[#121212] antialiased selection:bg-[#3A4A3A] selection:text-[#FDFBF7]",children:[h("style",{children:`
